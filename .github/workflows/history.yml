name: Pull history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Seasons to download, separated by spaces"
        default: "2022 2023 2024 2025 2026"
      only:
        description: "Optional: just these files (e.g. adv_all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: update-model
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download seasons
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python tools/fetch_history.py ${{ github.event.inputs.years }} ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - name: Save
        run: |
          git config user.name "cfb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "Pull history: ${{ github.event.inputs.years }}"
          git pull --rebase
          git push
